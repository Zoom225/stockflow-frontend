<main
  class="grid min-h-dvh place-items-center bg-slate-50 bg-[radial-gradient(circle_at_top_left,rgb(13_148_136_/_0.14),transparent_34rem)] px-4 py-8 sm:py-12"
>
  <section
    class="w-full max-w-2xl rounded-3xl border border-slate-200/80 bg-white/90 p-8 shadow-2xl shadow-slate-950/10 backdrop-blur-sm sm:p-12 lg:p-16"
    aria-labelledby="welcome-title"
  >
    <div class="flex items-center gap-3 text-lg font-bold tracking-tight text-slate-950">
      <span
        class="grid size-10 place-items-center rounded-xl bg-teal-700 text-xs tracking-[0.08em] text-white"
        aria-hidden="true"
      >
        SF
      </span>
      <span data-testid="app-name">{{ appName() }}</span>
    </div>

    <p class="mt-12 mb-3 text-xs font-bold tracking-[0.12em] text-teal-700 uppercase">
      Gestion de stock pour PME
    </p>
    <h1
      id="welcome-title"
      class="max-w-[12ch] text-4xl leading-none font-bold tracking-[-0.055em] text-slate-950 sm:text-6xl"
    >
      Le socle frontend est prêt.
    </h1>
    <p class="mt-6 max-w-xl text-base leading-7 text-slate-600 sm:text-lg sm:leading-8">
      Une base Angular moderne, stricte et maintenable pour construire les fonctionnalités de
      StockFlow étape par étape.
    </p>

    <ul class="mt-8 flex flex-wrap gap-2.5" aria-label="Socle technique">
      <li class="rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold">
        Angular 22
      </li>
      <li class="rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold">
        Tailwind CSS 4
      </li>
      <li class="rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold">
        TypeScript strict
      </li>
    </ul>

    <p
      class="mt-12 flex items-center gap-2.5 border-t border-slate-200 pt-5 text-sm text-slate-600"
      data-testid="app-status"
    >
      <span
        class="size-2.5 rounded-full bg-emerald-600 ring-4 ring-emerald-600/10"
        aria-hidden="true"
      ></span>
      Initialisation terminée
    </p>
  </section>
</main>

<router-outlet />
