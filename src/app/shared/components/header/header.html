<header
  class="sticky top-0 z-30 flex min-h-18 items-center justify-between border-b border-slate-200/80 bg-white/90 px-4 backdrop-blur-md sm:px-6 lg:px-8"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="inline-flex size-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-xs hover:bg-slate-50 hover:text-slate-950 focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2 focus-visible:outline-none lg:hidden"
      aria-label="Ouvrir la navigation"
      aria-controls="app-navigation"
      [attr.aria-expanded]="navigationOpen()"
      data-testid="menu-button"
      (click)="menuRequested.emit()"
    >
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
      </svg>
    </button>

    <div>
      <p class="text-[0.6875rem] font-bold tracking-[0.14em] text-teal-700 uppercase">StockFlow</p>
      <p class="text-sm font-semibold text-slate-950 sm:text-base">Espace de gestion</p>
    </div>
  </div>

  @if (currentUser(); as user) {
    <div class="flex min-w-0 items-center gap-2 sm:gap-3">
      <div class="hidden min-w-0 text-right sm:block">
        <p class="truncate text-sm font-semibold text-slate-950">
          {{ user.fullName || user.email }}
        </p>
        <p class="truncate text-xs text-slate-500">{{ roleLabel() }}</p>
      </div>

      <span
        class="grid size-9 shrink-0 place-items-center rounded-full bg-teal-100 text-xs font-bold text-teal-800 ring-1 ring-teal-200"
        aria-hidden="true"
      >
        {{ userInitials() }}
      </span>

      <button
        type="button"
        class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-950 focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2 focus-visible:outline-none"
        aria-label="Se déconnecter"
        title="Se déconnecter"
        data-testid="logout-button"
        (click)="logout()"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4m4-4H9" />
        </svg>
      </button>
    </div>
  }
</header>
