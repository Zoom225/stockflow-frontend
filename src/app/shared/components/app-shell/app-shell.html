<a
  href="#main-content"
  class="sr-only z-[60] rounded-lg bg-white px-4 py-3 font-semibold text-slate-950 shadow-lg focus:not-sr-only focus:fixed focus:top-4 focus:left-4"
>
  Aller au contenu principal
</a>

<div class="min-h-dvh bg-slate-50 lg:grid lg:grid-cols-[18rem_minmax(0,1fr)]">
  @if (isSidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/45 backdrop-blur-[1px] lg:hidden"
      aria-label="Fermer la navigation"
      data-testid="sidebar-backdrop"
      (click)="closeSidebar()"
    ></button>
  }

  <app-sidebar [isOpen]="isSidebarOpen()" (navigationSelected)="closeSidebar()" />

  <div class="min-w-0">
    <app-header [navigationOpen]="isSidebarOpen()" (menuRequested)="openSidebar()" />

    <main id="main-content" class="mx-auto w-full max-w-[100rem] p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
