<aside
  id="app-navigation"
  class="fixed inset-y-0 left-0 z-50 flex h-dvh w-72 flex-col border-r border-slate-800 bg-slate-950 text-slate-200 shadow-2xl shadow-slate-950/25 transition-transform duration-200 lg:sticky lg:top-0 lg:translate-x-0 lg:shadow-none"
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
  aria-label="Navigation principale"
>
  <div class="flex h-18 shrink-0 items-center gap-3 border-b border-slate-800 px-5">
    <span
      class="grid size-10 place-items-center rounded-xl bg-teal-500 text-xs font-black tracking-[0.08em] text-slate-950"
      aria-hidden="true"
    >
      SF
    </span>
    <div>
      <p class="font-bold tracking-tight text-white">StockFlow</p>
      <p class="text-xs text-slate-400">Gestion des stocks</p>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-6" aria-labelledby="main-navigation-label">
    <p
      id="main-navigation-label"
      class="mb-3 px-3 text-[0.6875rem] font-bold tracking-[0.14em] text-slate-500 uppercase"
    >
      Navigation
    </p>

    <ul class="space-y-1">
      @for (item of navigationItems; track item.label) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-teal-500/15 text-teal-200"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex min-h-11 items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300 hover:bg-white/5 hover:text-white focus-visible:ring-2 focus-visible:ring-teal-400 focus-visible:outline-none"
            [attr.data-testid]="item.testId"
            (click)="navigationSelected.emit()"
          >
            <svg
              class="size-5 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [attr.d]="item.iconPath" />
            </svg>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="shrink-0 border-t border-slate-800 p-4">
    <div class="rounded-xl border border-slate-800 bg-slate-900 px-4 py-3">
      <p class="text-xs font-semibold text-slate-300">Socle applicatif</p>
      <p class="mt-1 text-xs leading-5 text-slate-500">Angular 22 · Tailwind CSS 4</p>
    </div>
  </div>
</aside>
